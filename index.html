<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>작업 기록</title>
<style>
:root{--ink:#202020;--muted:#8b8b8b;--line:#e9e9e9;--paper:#fff;--soft:#f7f7f5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,76px);border-bottom:1px solid var(--line)}.brand{font-size:13px;letter-spacing:.2em;font-weight:600}.hamb{border:0;background:none;font-size:23px;width:42px;height:42px}.weeks{display:none;padding:18px clamp(20px,5vw,76px);gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}.weeks.open{display:flex}.week{border:1px solid transparent;background:none;color:#888;padding:9px 12px;font-size:12px}.week.active{border-color:#222;color:#222}.page{max-width:1040px;margin:58px auto;padding:0 24px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px}.eyebrow{font-size:11px;color:#999;letter-spacing:.15em}.title{font-size:27px;font-weight:400;margin:10px 0 0}.manage{background:#222;color:#fff;border:0;padding:12px 18px;font-size:12px}.export{border:1px solid #222;background:#fff;color:#222;padding:11px 16px;font-size:12px}.head-actions{display:flex;gap:9px;align-items:center}.viewer{position:relative;margin:0 auto;max-width:760px;padding:0 44px}.stage{position:relative;aspect-ratio:4/3;background:var(--soft);overflow:visible}.slide{position:absolute;inset:0;background:white;transition:transform .48s cubic-bezier(.2,.75,.2,1),opacity .48s;cursor:pointer;box-shadow:0 3px 18px #0000000a}.slide img{width:100%;height:100%;object-fit:contain}.slide.back{transform:translate(28px,0) scale(.97);opacity:.62;z-index:0;cursor:pointer}.slide.front{z-index:1;animation-duration:.42s;animation-timing-function:cubic-bezier(.2,.75,.2,1);animation-fill-mode:both}.slide.front.enter-next{animation-name:enterFromNext}.slide.front.enter-prev{animation-name:enterFromPrev}@keyframes enterFromNext{from{opacity:.45;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}@keyframes enterFromPrev{from{opacity:.45;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}.slide.empty{display:grid;place-items:center;color:#aaa;font-size:13px;cursor:default}.nav{position:absolute;inset:0 44px;pointer-events:none;z-index:5}.nav button{position:absolute;top:50%;transform:translateY(-50%);pointer-events:auto;border:1px solid var(--line);background:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;box-shadow:0 2px 8px #00000012}.nav button[data-step="-1"]{left:-18px}.nav button[data-step="1"]{right:-18px}.caption{max-width:760px;margin:20px auto 0;padding:0 44px;min-height:26px;font-size:13px;line-height:1.7;color:#666}.dots{display:flex;justify-content:center;gap:7px;margin-top:22px}.dot{width:5px;height:5px;border-radius:50%;border:0;background:#ddd;padding:0}.dot.on{background:#222}.empty-state{display:grid;place-items:center;min-height:380px;color:#aaa;font-size:13px}.modal{display:none;position:fixed;inset:0;z-index:10;background:#0006;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.dialog{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;padding:28px}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.dialog h2{font-size:19px;font-weight:500;margin:0}.close{border:0;background:none;font-size:24px;color:#777}.row{margin:14px 0}.row label{display:block;font-size:12px;color:#777;margin-bottom:7px}.row input,.row textarea,.row select{width:100%;border:1px solid var(--line);padding:11px;background:white;color:#222}.row textarea{min-height:64px;resize:vertical}.chooser{display:flex;gap:9px;align-items:center}.chooser select{flex:1}.quiet{border:1px solid var(--line);background:#fff;padding:10px 13px;font-size:12px}.image-list{display:grid;gap:12px}.image-card{border:1px solid var(--line);padding:12px;display:grid;grid-template-columns:100px 1fr;gap:12px}.thumb{width:100px;height:90px;background:#f5f5f5;object-fit:cover}.image-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.image-actions button{font-size:11px;padding:7px 9px}.dialog-foot{display:flex;justify-content:space-between;gap:10px;margin-top:24px;border-top:1px solid var(--line);padding-top:18px}.right-actions{display:flex;gap:8px}.danger{color:#a22;border:1px solid #e6cccc;background:#fff;padding:10px 13px;font-size:12px}.primary{color:white;background:#222;border:1px solid #222;padding:10px 18px;font-size:12px}.notice{font-size:12px;color:#777;min-height:18px;margin-top:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;font-size:12px;z-index:20;display:none}.toast.show{display:block}@media(max-width:600px){.page{margin:32px auto;padding:0 18px}.heading{align-items:center}.title{font-size:22px}.viewer{padding:0 30px}.nav{inset:0 30px}.nav button[data-step="-1"]{left:-15px}.nav button[data-step="1"]{right:-15px}.nav button{width:30px;height:30px}.caption{padding:0 30px}.dialog{padding:20px}.image-card{grid-template-columns:76px 1fr}.thumb{width:76px;height:76px}}
</style></head>
<body>
<header class="top"><div class="brand">WORK ARCHIVE</div><button class="hamb" id="menuToggle" aria-label="주차 메뉴">☰</button></header>
<nav class="weeks" id="weeks" aria-label="주차 선택"></nav>
<main class="page"><div class="heading"><div><div class="eyebrow" id="weekLabel">WEEK 01</div><h1 class="title" id="postTitle">작업 기록</h1></div><div class="head-actions"><button class="export" id="exportPdf">PDF 내보내기</button><button class="manage" id="manage">작업 업로드 / 편집</button></div></div><section id="viewerArea"></section></main>
<div class="modal" id="modal"><div class="dialog" role="dialog" aria-modal="true"><div class="dialog-head"><h2 id="dialogTitle">작업 관리</h2><button class="close" id="close" aria-label="닫기">×</button></div><div id="editor"></div><div class="notice" id="status"></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const DB_NAME='workArchiveDB_v4', STORE='posts', DB_VERSION=1;let db=null, selectedWeek=1, currentPostId=null, slideIndex=0, draft=null, busy=false, editingExisting=false, transitionDirection=1;
const $=id=>document.getElementById(id), weeks=$('weeks');
async function exportPDF(){const win=window.open('','_blank');if(!win){toast('PDF 창이 차단되었습니다. 팝업 허용 후 다시 시도해 주세요.');return}try{const all=await getAll(),posts=all.slice().sort((a,b)=>a.week-b.week||(a.createdAt||0)-(b.createdAt||0)),entries=[];for(const post of posts){for(const image of (post.images||[])){entries.push({title:post.title||'작업 기록',week:post.week,image:image.src,caption:image.caption||''})}}if(!entries.length){win.close();toast('내보낼 이미지가 없습니다.');return}const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pages=entries.map((e,i)=>`<section class="page"><header><div class="title">${escape(e.title)}</div><div class="course">KMUVCD 하이브리드이미징 26-2</div></header><main><div class="photo"><img src="${e.image}" alt="${escape(e.title)}"></div><div class="caption">${escape(e.caption)}</div></main><footer>${i+1}/${entries.length}</footer></section>`).join('');win.document.open();win.document.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>작업 기록 PDF</title><style>@page{size:A4 landscape;margin:0}*{box-sizing:border-box}html,body{margin:0;padding:0;color:#111;font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}.page{width:297mm;height:210mm;padding:11mm 12mm 10mm;display:flex;flex-direction:column;page-break-after:always;break-after:page}.page:last-child{page-break-after:auto;break-after:auto}header{height:13mm;display:flex;align-items:flex-start;justify-content:space-between;font-size:10pt;font-weight:700}header .title{max-width:65%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}header .course{white-space:nowrap}main{flex:1;min-height:0;display:grid;grid-template-columns:74% 22%;gap:4%;align-items:center}.photo{height:100%;min-height:0;display:flex;align-items:center;justify-content:center;background:#fff}.photo img{display:block;max-width:100%;max-height:100%;object-fit:contain}.caption{min-height:36mm;padding:10mm 8mm;background:#ddd;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;font-size:11pt;line-height:1.6}footer{height:10mm;display:flex;justify-content:flex-end;align-items:flex-end;font-size:9pt;padding-right:2mm}@media screen{body{background:#ddd}.page{margin:10px auto;background:white;box-shadow:0 1px 8px #0002}}</style></head><body>${pages}<script>window.onload=()=>setTimeout(()=>{window.focus();window.print()},400);${'</scr'+'ipt>'}</body></html>`);win.document.close()}catch(e){win.close();err(e)}}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('이 브라우저는 IndexedDB를 지원하지 않습니다.'));return}const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE)){const s=d.createObjectStore(STORE,{keyPath:'id'});s.createIndex('week','week',{unique:false})}};req.onsuccess=()=>{db=req.result;db.onversionchange=()=>db.close();resolve(db)};req.onerror=()=>reject(req.error||new Error('저장소를 열지 못했습니다.'));req.onblocked=()=>reject(new Error('다른 탭에서 저장소를 사용 중입니다. 탭을 닫고 다시 시도해 주세요.'))})}
function request(mode,fn){return new Promise((resolve,reject)=>{if(!db){reject(new Error('저장소 연결이 끊겼습니다. 페이지를 새로고침해 주세요.'));return}let tx,result,failed=false;try{tx=db.transaction(STORE,mode);const req=fn(tx.objectStore(STORE));req.onsuccess=()=>{result=req.result};req.onerror=()=>{failed=true;reject(req.error||tx.error||new Error('데이터 요청에 실패했습니다.'))};tx.oncomplete=()=>{if(!failed)resolve(result)};tx.onabort=()=>{failed=true;reject(tx.error||new Error('저장이 취소되었습니다.'))};tx.onerror=()=>{failed=true;reject(tx.error||new Error('IndexedDB 작업 중 오류가 발생했습니다.'))}}catch(e){reject(e)}})}
const getAll=()=>request('readonly',s=>s.getAll());const put=p=>request('readwrite',s=>s.put(p));const remove=id=>request('readwrite',s=>s.delete(id));
function err(e){console.error(e);toast('저장소 오류: '+(e&&e.message?e.message:'요청을 처리하지 못했습니다.'))}function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2800)}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
for(let i=1;i<=16;i++){const b=document.createElement('button');b.className='week'+(i===1?' active':'');b.textContent=i+'주';b.onclick=()=>{selectedWeek=i;document.querySelectorAll('.week').forEach(x=>x.classList.toggle('active',Number(x.textContent.replace('주',''))===i));render()};weeks.append(b)}
$('menuToggle').onclick=()=>weeks.classList.toggle('open');$('manage').onclick=()=>openManager();$('exportPdf').onclick=()=>exportPDF();$('close').onclick=closeModal;$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
async function render(){ $('weekLabel').textContent='WEEK '+String(selectedWeek).padStart(2,'0');try{const all=await getAll(), list=all.filter(p=>p.week===selectedWeek).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));const post=list.find(p=>p.id===currentPostId)||list[0];currentPostId=post?.id||null;if(!post){$('postTitle').textContent='작업 기록';$('viewerArea').innerHTML='<div class="empty-state">아직 등록된 작업이 없습니다.</div>';return}$('postTitle').textContent=post.title||'작업 기록';const imgs=post.images||[];if(!imgs.length){$('viewerArea').innerHTML='<div class="empty-state">이미지가 없습니다. 관리 메뉴에서 이미지를 추가하세요.</div>';return}slideIndex=Math.min(slideIndex,imgs.length-1);const i=slideIndex,j=(i+1)%imgs.length;let html='<div class="viewer"><div class="stage">';if(imgs.length>1)html+=`<div class="slide back" data-go="${j}"><img src="${imgs[j].src}" alt="다음 이미지 미리보기"></div>`;html+=`<div class="slide front ${transitionDirection>0?'enter-next':'enter-prev'}"><img src="${imgs[i].src}" alt="${escapeHtml(imgs[i].caption||post.title)}"></div></div><div class="nav">${i>0?'<button data-step="-1" aria-label="이전 이미지">‹</button>':''}${i<imgs.length-1?'<button data-step="1" aria-label="다음 이미지">›</button>':''}</div></div><div class="caption">${escapeHtml(imgs[i].caption||'')}</div><div class="dots">`;imgs.forEach((_,n)=>html+=`<button class="dot ${n===i?'on':''}" data-go="${n}" aria-label="${n+1}번째 이미지"></button>`);html+='</div>';$('viewerArea').innerHTML=html;$('viewerArea').querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{const next=Number(x.dataset.go);transitionDirection=next>=slideIndex?1:-1;slideIndex=next;render()});$('viewerArea').querySelectorAll('[data-step]').forEach(x=>x.onclick=()=>{transitionDirection=Number(x.dataset.step);slideIndex=(slideIndex+transitionDirection+imgs.length)%imgs.length;render()})}catch(e){$('viewerArea').innerHTML='<div class="empty-state">저장된 작업을 불러오지 못했습니다.</div>';err(e)}}
function closeModal(){if(busy)return;$('modal').classList.remove('show');draft=null}
async function openManager(){try{const all=await getAll(),current=all.find(p=>p.id===currentPostId);editingExisting=!!current;draft=current?structuredClone(current):{id:'p_'+crypto.randomUUID(),week:selectedWeek,title:'',images:[],createdAt:Date.now()};$('modal').classList.add('show');$('dialogTitle').textContent=editingExisting?'게시물 편집':'새 게시물';$('status').textContent='';$('editor').innerHTML='<div id="formArea"></div>';drawForm()}catch(e){err(e)}}

function drawForm(){const p=draft;$('formArea').innerHTML=`<div class="row"><label>주차</label><select id="editWeek">${Array.from({length:16},(_,i)=>`<option value="${i+1}" ${p.week===i+1?'selected':''}>${i+1}주차</option>`).join('')}</select></div><div class="row"><label>게시물 제목</label><input id="editTitle" maxlength="120" value="${escapeHtml(p.title)}" placeholder="작업 제목"></div><div class="row"><label>이미지</label><div class="image-list" id="imageList"></div><button class="quiet" id="addImages" style="margin-top:10px">＋ 이미지 추가</button><input id="fileInput" type="file" accept="image/*" multiple hidden></div><div class="dialog-foot"><div>${editingExisting?'<button class="danger" id="deletePost">게시물 삭제</button>':''}</div><div class="right-actions"><button class="quiet" id="cancel">취소</button><button class="primary" id="save">저장</button></div></div>`;$('editWeek').onchange=e=>p.week=Number(e.target.value);$('editTitle').oninput=e=>p.title=e.target.value;$('addImages').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{for(const f of e.target.files){if(!f.type.startsWith('image/'))continue;try{p.images.push({id:'i_'+crypto.randomUUID(),src:await readFile(f),caption:''})}catch(ex){err(ex)}}drawImageList()};$('cancel').onclick=closeModal;$('save').onclick=saveDraft;const del=$('deletePost');if(del)del.onclick=deletePost;drawImageList()}
function drawImageList(){const list=$('imageList');if(!list)return;list.innerHTML=draft.images.length?draft.images.map((im,i)=>`<div class="image-card" draggable="true" data-card="${i}" title="드래그하여 순서 변경"><img class="thumb" src="${im.src}" alt="미리보기"><div><div style="font-size:12px;color:#888;margin-bottom:6px">이미지 ${i+1} · ⠿ 드래그하여 순서 변경</div><textarea data-caption="${i}" placeholder="이 이미지의 캡션">${escapeHtml(im.caption)}</textarea><div class="image-actions"><button class="quiet" data-replace="${i}">이미지 교체</button><button class="danger" data-remove="${i}">이미지 삭제</button></div><input type="file" accept="image/*" data-file="${i}" hidden></div></div>`).join(''):'<div style="font-size:12px;color:#aaa;padding:12px">추가된 이미지가 없습니다.</div>';list.querySelectorAll('[data-caption]').forEach(x=>x.oninput=()=>draft.images[Number(x.dataset.caption)].caption=x.value);list.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{draft.images.splice(Number(x.dataset.remove),1);drawImageList()});list.querySelectorAll('[data-replace]').forEach(x=>x.onclick=()=>list.querySelector(`[data-file="${x.dataset.replace}"]`).click());list.querySelectorAll('[data-file]').forEach(x=>x.onchange=async()=>{const f=x.files?.[0];if(!f)return;try{draft.images[Number(x.dataset.file)].src=await readFile(f);drawImageList()}catch(e){err(e)}});let dragFrom=null;list.querySelectorAll('[data-card]').forEach(card=>{card.addEventListener('dragstart',e=>{dragFrom=Number(card.dataset.card);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragFrom))});card.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move'});card.addEventListener('drop',e=>{e.preventDefault();const from=dragFrom??Number(e.dataTransfer.getData('text/plain')),to=Number(card.dataset.card);if(Number.isInteger(from)&&from!==to){const moved=draft.images.splice(from,1)[0];draft.images.splice(to,0,moved);drawImageList()}})})}
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('이미지 파일을 읽지 못했습니다.'));r.readAsDataURL(file)})}
async function saveDraft(){if(busy)return;draft.title=$('editTitle').value.trim();draft.week=Number($('editWeek').value);if(!draft.title){$('status').textContent='게시물 제목을 입력해 주세요.';return}if(!draft.images.length){$('status').textContent='이미지를 한 장 이상 추가해 주세요.';return}busy=true;$('status').textContent='저장 중…';$('save').disabled=true;try{await put({...draft,updatedAt:Date.now()});currentPostId=draft.id;selectedWeek=draft.week;slideIndex=0;$('modal').classList.remove('show');toast('저장했습니다.');await render()}catch(e){$('status').textContent='저장하지 못했습니다. 변경 내용은 화면에 남아 있습니다.';err(e)}finally{busy=false}}
async function deletePost(){if(busy||!draft)return;if(!confirm('이 게시물과 이미지, 캡션을 모두 삭제할까요?'))return;busy=true;$('status').textContent='삭제 중…';try{await remove(draft.id);currentPostId=null;$('modal').classList.remove('show');toast('게시물을 삭제했습니다.');await render()}catch(e){$('status').textContent='삭제하지 못했습니다.';err(e)}finally{busy=false}}
openDB().then(render).catch(e=>{console.error(e);$('viewerArea').innerHTML='<div class="empty-state">브라우저 저장소를 사용할 수 없습니다. 파일을 최신 Chrome, Edge 또는 Safari에서 열어 주세요.</div>';toast('IndexedDB 연결 실패: '+e.message)});
})();
</script></body></html>
